name: Question
description: Ask how something works or how to use it.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: The readme and SPEC.md may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you tried, which version, your setup.
