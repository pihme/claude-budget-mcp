name: Bug report
description: Something in claude-budget-mcp does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the open issues first.
        **Never paste tokens, keys or credentials.** Security problems go through private reporting (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version or the commit you built.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Output or error message. Remove anything personal.
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and architecture, runtime and tool versions.
