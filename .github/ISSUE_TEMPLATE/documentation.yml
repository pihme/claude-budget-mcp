name: Documentation
description: Something in the readme or spec is wrong, unclear or missing.
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File and section.
      placeholder: README.md, "Getting started" / https://pihme.github.io/claude-budget-mcp/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: If the docs disagree with the code, say which part of the code.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
